{% extends "redefine_base.html" %}{% block title %}片段｜Orange手记{% endblock %}{% block content %}<div class="main-content"><div class="page-template-container"><h1 class="page-title-header">片段</h1></div><ul class="home-article-list">{% for note in notes %}<li class="home-article-item" id="note-{{ note.id }}"><div class="flex flex-col gap-5 px-7 pb-7 pt-5"><div class="home-article-content markdown-body"><p>{{ note.content }}</p></div><div class="home-article-meta-info"><time>{{ note.created_at|date_zh }}</time><span>{{ note.mood }}</span></div></div></li>{% else %}<li class="home-article-item p-7">暂无片段。</li>{% endfor %}</ul></div>{% endblock %}

<section class="orange-project-card home-study-notes" aria-labelledby="home-study-notes-title">
  <div class="home-study-notes-header">
    <h2 id="home-study-notes-title">笔记</h2>
    <a class="home-study-notes-all" href="{{ url_for('study_notes') }}">查看全部笔记 <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
  </div>
  <ul class="home-study-notes-list" role="list">
    {% for note in home_study_notes %}
    <li>
      <a class="home-study-note" href="{{ url_for('study_note', slug=note.slug) }}">
        <img class="study-note-cover" src="{{ url_for('study_note_asset', slug=note.slug, filename='cover.webp') }}"
             width="360" height="509" loading="lazy" decoding="async" alt="">
        <div>
          <p class="study-note-meta">{{ note.topic }}</p>
          <h3>{{ note.title }}</h3>
        </div>
      </a>
    </li>
    {% endfor %}
  </ul>
</section>

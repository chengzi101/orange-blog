<form method="post" action="/auth/phone" class="profile-form profile-phone-form" data-unified-form data-purpose="change">
  <input type="hidden" name="csrf_token" value="{{ reader_csrf_token() }}">
  <input type="hidden" name="challenge_id" value="{{ request.form.get('challenge_id', '') }}">
  <input type="hidden" name="old_challenge_id" value="{{ request.form.get('old_challenge_id', '') }}">
  <label for="phone-old-code">原手机验证码</label><div class="profile-code-row"><input id="phone-old-code" name="old_code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required><button type="button" class="profile-send-code" data-send-old>获取验证码</button></div>
  <label for="phone-new-number">新手机号</label><input id="phone-new-number" name="phone" type="tel" value="{{ request.form.get('phone', '') }}" inputmode="numeric" pattern="1[3-9][0-9]{9}" maxlength="11" autocomplete="tel-national" placeholder="11 位手机号" required>
  <label for="phone-new-code">新手机验证码</label><div class="profile-code-row"><input id="phone-new-code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required><button type="button" class="profile-send-code" data-send-code>获取验证码</button></div>
  <p class="profile-help profile-sms-status" role="status" aria-live="polite"></p>
  <button type="submit" class="reader-primary">确认更换</button>
</form>

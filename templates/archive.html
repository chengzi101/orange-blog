{% extends "redefine_base.html" %}{% block title %}归档｜Orange手记{% endblock %}{% block content %}<div class="main-content"><div class="archive-container shadow-none hover:shadow-none sm:shadow-redefine sm:hover:shadow-redefine-hover"><div class="archive-list-container">{% for year,items in grouped.items() %}<section class="archive-item mb-spacing-unit last:mb-0"><div class="archive-item-header flex flex-row items-center mb-2"><span class="archive-year font-semibold text-3xl mr-2">{{ year }}</span><span class="archive-year-post-count text-xs md:text-sm font-bold rounded-small bg-third-background-color py-[2px] px-[10px] border border-border-color">{{ items|length }}</span></div><ul class="article-list pl-0 md:pl-8 text-lg leading-[1.5]">{% for item in items %}<li class="article-item space-y-2 px-6 pt-10 pb-2 text-xl relative border-l-2 border-border-color" date-is="{{ item.date[5:10] }}"><a href="{{ item.url }}" class="block w-fit"><span class="article-title my-0.5 text-2xl">{{ item.title }}</span></a></li>{% endfor %}</ul></section>{% else %}<h1 class="page-title-header">Archives</h1><p>暂无公开记录。</p>{% endfor %}</div></div></div>{% endblock %}

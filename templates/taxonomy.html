{% extends "redefine_base.html" %}{% block title %}分类｜Orange手记{% endblock %}{% block content %}<style>/* Extend the category link over its entire card without changing the layout. */.category-list-content .all-category-list>.all-category-list-item{position:relative}.category-list-content .all-category-list>.all-category-list-item>.all-category-list-link::after{content:"";position:absolute;inset:0;border-radius:inherit}.category-list-content .all-category-list>.all-category-list-item:focus-within{outline:2px solid var(--primary-color);outline-offset:3px}</style><div class="main-content"><div class="page-template-container"><h1 class="page-title-header">Categories</h1><div class="category-list-content"><ul class="all-category-list">{% for category in topic_categories %}<li class="all-category-list-item"><a class="all-category-list-link" href="{{ url_for('articles',category=category.category) }}">{{ category.category }}</a><span class="all-category-list-count">{{ category.count }}</span></li>{% else %}<li>暂无分类</li>{% endfor %}</ul></div></div></div>{% endblock %}
